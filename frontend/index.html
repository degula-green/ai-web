<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容营销自动化 - Vue3 重构版</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Noto+Sans:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563EB',
              'primary-hover': '#1D4ED8',
              'primary-light': '#DBEAFE',
              background: '#F8F9FA',
              surface: '#FFFFFF',
              'surface-secondary': '#F1F5F9',
              border: '#E2E8F0',
              'border-light': '#E5E7EB',
              'text-main': '#1E293B',
              'text-secondary': '#64748B',
              'text-tertiary': '#94A3B8',
              'text-sub': '#64748B',
            },
            fontFamily: {
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            boxShadow: {
              node: '0 8px 24px rgba(15, 23, 42, 0.06)',
              'node-hover': '0 12px 28px rgba(15, 23, 42, 0.12)',
            },
          },
        },
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
