[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-automation-backend"
version = "0.1.0"
description = "Engineering skeleton for AI content automation workflows."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "qdrant-client>=1.9,<2.0",
    "minio>=7.2,<8.0",
    "pymysql>=1.1,<2.0",
    "langchain-core>=0.2,<1.0",
    "pytest>=9.0,<10.0",
    "playwright>=1.42,<2.0",
    "playwright-stealth>=1.0.6",
    "patchright==1.58.2",
    "loguru==0.7.3",
    "opencv-python>=4.13.0.92",
    "qrcode==8.2",
    "requests==2.32.3",
    "segno>=1.6.6",
    "cryptography>=42.0",
    "python-multipart>=0.0.12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
